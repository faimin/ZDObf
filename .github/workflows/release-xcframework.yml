name: Build and release ZDObfRuntime XCFramework

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build all Apple platform slices
        run: ./scripts/build_xcframework.sh

      - name: Validate Swift Package Manager integration
        run: swift build

      - name: Package XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ZDObfRuntime.xcframework \
            dist/ZDObfRuntime.xcframework.zip
          shasum -a 256 dist/ZDObfRuntime.xcframework.zip \
            > dist/ZDObfRuntime.xcframework.zip.sha256

      - name: Show pin instructions
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum=$(swift package compute-checksum dist/ZDObfRuntime.xcframework.zip)
          {
            echo "### ZDObfRuntime.xcframework.zip"
            echo ""
            echo "- sha256: \`$checksum\`"
            echo "- 发布后固定: \`scripts/pin_runtime_release.sh $version dist/ZDObfRuntime.xcframework.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ZDObfRuntime-xcframework
          path: |
            dist/ZDObfRuntime.xcframework.zip
            dist/ZDObfRuntime.xcframework.zip.sha256

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/ZDObfRuntime.xcframework.zip
            dist/ZDObfRuntime.xcframework.zip.sha256
          generate_release_notes: true
